name: ClearLayer Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static HTML/CSS
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/static-assets
          cp static-site/index.html static-site/styles.css _site/
          cp static-assets/clearlayer-wordmark.png \
             static-assets/blueprint.png \
             static-assets/structure.jpg \
             static-assets/clearlayer-v2-front-reference-crop.png \
             static-assets/clearlayer-v1-frontal-adhesive.png \
             static-assets/clearlayer-v1-threequarter-correct.png \
             static-assets/IMG_5131.JPG \
             static-assets/clearlayer-v1-rimless-adhesive.png \
             static-assets/clearlayer-profile-strip.png \
             static-assets/clearlayer-profile-detail-sheet.png \
             static-assets/clearlayer-logo-reference.JPG \
             _site/static-assets/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
